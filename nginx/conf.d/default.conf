# =============================================================================
#  Keycloak  —  https://keycloak.auth.example.test
#  nginx terminates TLS and forwards plain HTTP to the Keycloak container.
# =============================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name keycloak.auth.example.test;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Keycloak admin console sends fairly large requests/responses.
    proxy_buffer_size       16k;
    proxy_buffers           8 32k;
    proxy_busy_buffers_size 64k;

    location / {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-Server $host;
    }
}

# =============================================================================
#  Main application  —  https://auth.example.test
#
#  Every protected location performs an `auth_request` subrequest to
#  oauth2-proxy (`/oauth2/auth`). oauth2-proxy answers:
#    - 202 + X-Auth-Request-* / Authorization headers when authenticated
#    - 401 when the session is missing/expired
#  A 401 is turned into a redirect to `/oauth2/start`, which starts the
#  OIDC login against Keycloak.
# =============================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name auth.example.test;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /usr/share/nginx/html;
    index index.html;

    # ---- oauth2-proxy: auth check (internal subrequest only) ----------------
    location = /oauth2/auth {
        internal;
        proxy_pass http://oauth2-proxy:4180;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header Content-Length     "";
        proxy_pass_request_body off;
    }

    # ---- oauth2-proxy: UI endpoints (start / callback / sign_out) -----------
    location /oauth2/ {
        proxy_pass http://oauth2-proxy:4180;
        proxy_set_header Host                     $host;
        proxy_set_header X-Real-IP                $remote_addr;
        proxy_set_header X-Forwarded-For          $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto        $scheme;
        proxy_set_header X-Auth-Request-Redirect  $request_uri;
    }

    # ---- backend API (protected, access token forwarded) --------------------
    location /api/ {
        auth_request /oauth2/auth;
        error_page 401 = @error401;

        # Capture what oauth2-proxy returned on the 202 response.
        auth_request_set $auth_token  $upstream_http_x_auth_request_access_token;
        auth_request_set $auth_user   $upstream_http_x_auth_request_user;
        auth_request_set $auth_email  $upstream_http_x_auth_request_email;

        proxy_pass http://backend:8000;
        proxy_set_header Host                 $host;
        proxy_set_header X-Real-IP            $remote_addr;
        proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto    $scheme;
        # X-Auth-Request-Access-Token carries the raw access token (no prefix).
        proxy_set_header Authorization        "Bearer $auth_token";
        proxy_set_header X-Auth-Request-User  $auth_user;
        proxy_set_header X-Auth-Request-Email $auth_email;
    }

    # ---- static files / index.html (protected) ------------------------------
    location / {
        auth_request /oauth2/auth;
        error_page 401 = @error401;
        try_files $uri $uri/ /index.html;
        # Never cache the protected page: otherwise after logout the browser
        # can show a stale copy instead of redirecting to the login page.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ---- unauthenticated: redirect to oauth2-proxy login --------------------
    location @error401 {
        return 302 https://$host/oauth2/start?rd=$scheme://$host$request_uri;
    }
}
